<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artwork Catalogue</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  /* ============================================================
     CONFIG lives in the <script> at the bottom of this file.
     To go live, set SHEET_CSV_URL there to your published link.
     ============================================================ */

  :root{
    --paper:#f4f2ec;      /* page ground, a warm toned-paper neutral */
    --surface:#fcfbf8;    /* card surface */
    --ink:#242019;        /* primary text, warm near-black */
    --muted:#7a7266;      /* labels and secondary text */
    --line:#ddd7cc;       /* hairline rules and borders */
    --accent:#31504a;     /* a quiet slate-green, used sparingly */
    --mat:#efece4;        /* inner mat behind each image */
    --maxw:1180px;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, sans-serif;
    font-size:15px;
    line-height:1.5;
  }

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}

  /* ---- Masthead ---- */
  header.masthead{padding:44px 0 20px;}
  .masthead h1{
    font-family:"Spectral", Georgia, serif;
    font-weight:500;
    font-size:clamp(28px, 4vw, 40px);
    letter-spacing:.2px;
    margin:0 0 6px;
    line-height:1.1;
  }
  .masthead .sub{color:var(--muted); font-size:14px;}
  .masthead .rule{height:1px; background:var(--line); margin:20px 0 0;}

  /* ---- Controls ---- */
  .controls{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    padding:18px 0 8px;
  }
  .controls .search{flex:1 1 260px; position:relative;}
  .controls input[type="search"], .controls select{
    width:100%;
    font:inherit; color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    padding:10px 12px;
  }
  .controls select{width:auto; min-width:150px;}
  .controls input:focus, .controls select:focus{
    outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
  }
  .count{color:var(--muted); font-size:13px; margin-left:auto;}

  /* ---- Notice bar ---- */
  .notice{
    margin:14px 0 0;
    padding:10px 14px;
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    background:var(--surface);
    color:var(--ink);
    font-size:13.5px;
    border-radius:2px;
  }
  .notice.hidden{display:none;}

  /* ---- Grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:26px 22px;
    padding:26px 0 60px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card .frame{
    background:var(--mat);
    padding:16px;
    display:flex; align-items:center; justify-content:center;
    min-height:180px;
  }
  .card .frame img{
    max-width:100%; height:auto; display:block;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .card .frame .missing{
    color:var(--muted); font-size:12.5px; text-align:center; padding:24px 8px;
  }
  .card .body{padding:14px 15px 16px;}
  .card .id{
    font-family:"Spectral", Georgia, serif;
    font-size:18px; font-weight:500; line-height:1.15;
    margin:0;
  }
  .card .type{color:var(--muted); font-size:12.5px; margin:2px 0 10px;}

  dl.meta{margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px;}
  dl.meta dt{color:var(--muted); font-size:12px;}
  dl.meta dd{margin:0; font-size:13px;}

  .empty{
    grid-column:1 / -1;
    text-align:center; color:var(--muted);
    padding:60px 0; font-size:15px;
  }

  footer.foot{
    border-top:1px solid var(--line);
    padding:22px 0 50px; color:var(--muted); font-size:12.5px;
  }

  @media (max-width:560px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px 14px;}
    .count{margin-left:0; width:100%;}
  }
  @media (prefers-reduced-motion:no-preference){
    .grid{opacity:0; animation:fade .5s ease forwards;}
    @keyframes fade{to{opacity:1;}}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1 id="pageTitle">Artwork Catalogue</h1>
    <div class="sub" id="pageSub"></div>
    <div class="rule"></div>
  </header>

  <div class="controls">
    <div class="search">
      <input type="search" id="search" placeholder="Search by id, medium, type…" aria-label="Search the catalogue">
    </div>
    <select id="typeFilter" aria-label="Filter by type"></select>
    <span class="count" id="count"></span>
  </div>

  <div class="notice hidden" id="notice"></div>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<footer class="foot">
  <div class="wrap" id="footNote"></div>
</footer>

<script>
/* ============================================================
   CONFIG  —  edit these values
   ============================================================ */

// 1) Paste your PUBLISHED CSV link between the quotes.
//    Google Sheets: File > Share > Publish to web > pick the "Web" tab > CSV > Publish.
//    Leave it empty to see the built-in preview with sample entries.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThQlNRe9c4thGPaDNLfMywOGAmZIPTYyDZQTmXvlWCFf_qzTia44vK5gmGbE9kyN0Dc0NstkuEpYMh/pub?gid=574718782&single=true&output=csv";

// 2) Where your thumbnails are served from (your jsDelivr base, ending in a slash).
const IMAGE_BASE = "https://cdn.jsdelivr.net/gh/rebeccacgray/art-catalog-images@main/";

// 3) How each image filename is built from a row. Your files are images_th/<ID>_th.jpg
const imageUrlForRow = (row) => IMAGE_BASE + "images_th/" + (row["ID"] || "").trim() + "_th.jpg";

// 4) The heading and subtitle on each card.
const HEADING_FIELD  = "ID";
const SUBTITLE_FIELD = "Type";

// 5) The detail rows shown under each card, in order.
//    key = the exact column header from your sheet. format is optional.
const FIELDS = [
  { key: "Index Name", label: "Index name" },
  { key: "No.",        label: "No." },
  { key: "Medium",     label: "Medium" },
  { key: "Size HxW",   label: "Size" },
  { key: "Start Date", label: "Year",     format: "year" },
  { key: "Price",      label: "Price",    format: "price" },
  { key: "Location",   label: "Location" },
];

// 6) Which column drives the dropdown filter.
const FILTER_FIELD = "Type";

// 7) The masthead title.
const PAGE_TITLE = "Artwork Catalogue";

/* ============================================================
   Below here you should not need to change anything.
   ============================================================ */

const SAMPLE = [
  { "ID":"AANIY001","No.":"","Index Name":"AANIY001","Type":"DRAWING",
    "Medium":"Brown and White Pencil on Toned Paper","Size HxW":"14\" x 11\"",
    "Start Date":"2017-01-10","Price":"800","Location":"Studio - Swartz Creek, MI" },
  { "ID":"AANIY002","No.":"","Index Name":"AANIY002","Type":"DRAWING",
    "Medium":"Brown and White Pencil on Toned Paper","Size HxW":"14\" x 11\"",
    "Start Date":"2017-02-10","Price":"800","Location":"" },
];

let ALL = [];

const $ = (id) => document.getElementById(id);

document.title = PAGE_TITLE;
$("pageTitle").textContent = PAGE_TITLE;

function fmt(value, format){
  const v = (value == null ? "" : String(value)).trim();
  if(!v) return "";
  if(format === "year"){
    const m = v.match(/\d{4}/);
    return m ? m[0] : v;
  }
  if(format === "price"){
    const n = Number(v.replace(/[^0-9.\-]/g, ""));
    return isFinite(n) && v.match(/\d/) ? "$" + n.toLocaleString() : v;
  }
  return v;
}

function cardFor(row){
  const card = document.createElement("article");
  card.className = "card";

  const frame = document.createElement("div");
  frame.className = "frame";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.alt = (row[HEADING_FIELD] || "") + " " + (row[SUBTITLE_FIELD] || "");
  img.src = imageUrlForRow(row);
  img.onerror = () => {
    frame.innerHTML = '<div class="missing">Image not found<br>' +
                      (row["ID"] || "") + "_th.jpg</div>";
  };
  frame.appendChild(img);

  const body = document.createElement("div");
  body.className = "body";

  const h = document.createElement("p");
  h.className = "id";
  h.textContent = row[HEADING_FIELD] || "";
  body.appendChild(h);

  const sub = fmt(row[SUBTITLE_FIELD]);
  if(sub){
    const s = document.createElement("p");
    s.className = "type";
    s.textContent = sub;
    body.appendChild(s);
  }

  const dl = document.createElement("dl");
  dl.className = "meta";
  FIELDS.forEach(f => {
    const val = fmt(row[f.key], f.format);
    if(!val) return;
    const dt = document.createElement("dt"); dt.textContent = f.label;
    const dd = document.createElement("dd"); dd.textContent = val;
    dl.appendChild(dt); dl.appendChild(dd);
  });
  body.appendChild(dl);

  card.appendChild(frame);
  card.appendChild(body);
  return card;
}

function render(rows){
  const grid = $("grid");
  grid.innerHTML = "";
  if(!rows.length){
    grid.innerHTML = '<p class="empty">No works match that search.</p>';
  } else {
    const frag = document.createDocumentFragment();
    rows.forEach(r => frag.appendChild(cardFor(r)));
    grid.appendChild(frag);
  }
  $("count").textContent = rows.length + (rows.length === 1 ? " work" : " works");
}

function applyFilters(){
  const q = $("search").value.trim().toLowerCase();
  const t = $("typeFilter").value;
  const rows = ALL.filter(row => {
    if(t && (row[FILTER_FIELD] || "").trim() !== t) return false;
    if(!q) return true;
    const hay = [HEADING_FIELD, SUBTITLE_FIELD, ...FIELDS.map(f=>f.key)]
      .map(k => (row[k] || "")).join(" ").toLowerCase();
    return hay.includes(q);
  });
  render(rows);
}

function buildTypeFilter(){
  const sel = $("typeFilter");
  const types = [...new Set(ALL.map(r => (r[FILTER_FIELD]||"").trim()).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All ' + FILTER_FIELD.toLowerCase() + 's</option>';
  types.forEach(t => {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
}

function start(rows, isSample){
  // keep only rows that actually have an ID
  ALL = rows.filter(r => (r["ID"] || "").trim());
  buildTypeFilter();
  applyFilters();
  const now = new Date();
  $("pageSub").textContent = isSample
    ? "Preview"
    : "Loaded " + now.toLocaleDateString() + " · " + now.toLocaleTimeString();
  $("footNote").textContent = isSample
    ? "Showing sample entries."
    : "Catalogue reads live from your sheet. Edit the sheet, then reload this page to see changes.";
  const notice = $("notice");
  if(isSample){
    notice.classList.remove("hidden");
    notice.innerHTML = "Preview with two sample entries. To go live, open this file, set " +
      "<strong>SHEET_CSV_URL</strong> to your published CSV link, and reload.";
  } else {
    notice.classList.add("hidden");
  }
}

function loadLive(){
  Papa.parse(SHEET_CSV_URL, {
    download:true, header:true, skipEmptyLines:true,
    complete:(res) => {
      if(!res.data || !res.data.length){ showError(); return; }
      start(res.data, false);
    },
    error:showError
  });
}

function showError(){
  ALL = [];
  render([]);
  const notice = $("notice");
  notice.classList.remove("hidden");
  notice.innerHTML = "Couldn't read the sheet. Check that the <strong>Web</strong> tab is " +
    "published to the web as CSV, and that <strong>SHEET_CSV_URL</strong> holds that exact link.";
  $("grid").innerHTML = '<p class="empty">Nothing to show yet.</p>';
}

$("search").addEventListener("input", applyFilters);
$("typeFilter").addEventListener("change", applyFilters);

if(SHEET_CSV_URL && SHEET_CSV_URL.trim()){
  loadLive();
} else {
  start(SAMPLE, true);
}
</script>
</body>
</html>
